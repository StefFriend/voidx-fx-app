name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compila
        run: gradle --no-daemon assembleDebug
      - name: Rinomina
        run: cp app/build/outputs/apk/debug/app-debug.apk VoidXFX.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VoidXFX-apk
          path: VoidXFX.apk
      - name: Pubblica come release "ultima" (scaricabile dal telefono)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima -y --cleanup-tag || true
          gh release create ultima VoidXFX.apk --title "VoidX FX - ultima build" \
            --notes "Build automatica del commit ${GITHUB_SHA::7}. Scarica VoidXFX.apk dal telefono e installalo (consenti le app da origini sconosciute)."
